name: Android 12+ Test APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android 12+ APK
        run: gradle clean assembleDebug
      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Flow-Budget-Android12Plus-v0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Budget-Android12Plus-v0.2
          path: Flow-Budget-Android12Plus-v0.2.apk
