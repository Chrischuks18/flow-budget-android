name: Android Installable APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle clean assembleDebug
      - name: Locate installed Android build tools
        id: tools
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "dir=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "Using $BUILD_TOOLS"
      - name: Verify APK ZIP and manifest
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          "${{ steps.tools.outputs.dir }}/aapt" dump badging "$APK"
      - name: Verify APK signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "${{ steps.tools.outputs.dir }}/apksigner" verify --verbose --print-certs "$APK"
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FlowBudget-v0.2.1-Android12Plus.apk
          sha256sum FlowBudget-v0.2.1-Android12Plus.apk > FlowBudget-v0.2.1-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FlowBudget-v0.2.1-Android12Plus
          path: |
            FlowBudget-v0.2.1-Android12Plus.apk
            FlowBudget-v0.2.1-SHA256.txt
